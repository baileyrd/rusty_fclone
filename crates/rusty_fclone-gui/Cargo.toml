[package]
name = "rusty_fclone-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri-based GUI for rusty_fclone"
publish = false

[lib]
name = "rusty_fclone_gui_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusty_fclone-core = { path = "../rusty_fclone-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# Already present in the dependency tree as one of Tauri's own transitive
# dependencies (its own `app_config_dir()` uses it internally) -- declared
# here directly so `profiles::default_profiles_dir` can resolve the OS
# config directory as a plain function, with no `AppHandle` needed
# (SCAN-PROFILES, ADR-0029). No new supply-chain surface: same crate,
# same version already in Cargo.lock.
dirs = "6"

[dev-dependencies]
tempfile = { workspace = true }
tauri = { version = "2", features = ["test"] }
# Test-only: constructs real synthetic image files for
# `find_similar_images` IPC tests. Production GUI code never touches
# `image` directly -- only `rusty_fclone_core::find_similar_images` does.
image = { workspace = true }
