[package]
name = "rusty_fclone-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for rusty_fclone"
publish = false

[[bin]]
name = "rusty-fclone"
path = "src/main.rs"

[dependencies]
rusty_fclone-core = { path = "../rusty_fclone-core" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: constructs real synthetic image files for
# `--find-similar-images` CLI tests. Production CLI code never touches
# `image` directly -- only `rusty_fclone_core::find_similar_images` does.
image.workspace = true
