name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        # rusty_fclone-gui (ADR-0020) links against the system webview —
        # the one dependency in this workspace that needs a C toolchain
        # and system dev packages, not just crates.io (ADR-0017's
        # rusqlite-bundled precedent, at platform scale). Package list
        # matches Tauri's own documented Linux prerequisites for a v2 app.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libsoup-3.0-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo bench --no-run
        # Compile-only: catches benchmark drift on every push without
        # paying for a full statistical run (slow, variance-prone on
        # shared runners) on every PR. Run `cargo bench -p rusty_fclone-core`
        # locally for real numbers — see docs/roadmap/ROADMAP.md.
        run: cargo bench --workspace --no-run

      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps
