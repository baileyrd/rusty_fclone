name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach binaries to. GitHub can only
          dispatch this workflow from a ref where release.yml itself
          exists, so a tag created before this workflow was added (e.g.
          v0.1.0) can't be dispatched from directly -- dispatch from
          main instead and set this input to that tag name.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build rusty-fclone
        run: cargo build --release --locked -p rusty_fclone-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="rusty-fclone-${{ env.RELEASE_TAG }}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/rusty-fclone" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "rusty-fclone-${{ env.RELEASE_TAG }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rusty-fclone.exe" "$staging/"
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE "$staging/"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$staging.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # GUI (Tauri, ADR-0020): Linux only for now. Links against the system
  # webview, so the bundle is a .deb / AppImage rather than a bare binary.
  build-gui-linux:
    name: build-gui (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libsoup-3.0-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            target
          key: ${{ runner.os }}-release-gui-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tauri-cli
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Build GUI bundles
        working-directory: crates/rusty_fclone-gui
        run: cargo tauri build --bundles deb,appimage

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
